name: Targeted RouteLocation Checks

on:
  push:
    branches: ['feat/**']

permissions:
  contents: read

jobs:
  focused:
    if: contains(github.event.head_commit.message, '[checks only]')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run focused tests without creating an IPA
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          xcodebuild test -project StikDebug.xcodeproj -scheme StikDebug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:StikDebugTests/V1_2_27LayoutTests \
            -only-testing:StikDebugTests/SmartRouteGeneratorTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
