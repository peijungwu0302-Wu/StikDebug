name: Build RouteLocation IPA

on:
  push:
    branches: [main]
    tags: ['routelocation-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile, test, and package
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project StikDebug.xcodeproj -scheme StikDebug

      - name: Run unit tests
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:StikDebugTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned app
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/RouteLocation.xcarchive" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#routelocation-v}"
          if [[ "$GITHUB_REF" != refs/tags/routelocation-v* ]]; then VERSION="1.2.4"; fi
          test -d "$RUNNER_TEMP/RouteLocation.xcarchive/Products/Applications/RouteLocation.app"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/RouteLocation.xcarchive/Products/Applications/RouteLocation.app" "$RUNNER_TEMP/package/Payload/RouteLocation.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/RouteLocation-unsigned.ipa" Payload
          cp "$GITHUB_WORKSPACE/RouteLocation-unsigned.ipa" "$GITHUB_WORKSPACE/RouteLocation-v${VERSION}-unsigned.ipa"
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/RouteLocation-unsigned.ipa" | grep 'Payload/RouteLocation.app/'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: RouteLocation-unsigned-${{ github.sha }}
          path: |
            RouteLocation-unsigned.ipa
            RouteLocation-v*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: startsWith(github.ref, 'refs/tags/routelocation-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "RouteLocation-v${GITHUB_REF_NAME#routelocation-v}-unsigned.ipa#RouteLocation-v${GITHUB_REF_NAME#routelocation-v}-unsigned.ipa" \
            RouteLocation-unsigned.ipa#RouteLocation-unsigned.ipa \
            --title "RouteLocation ${GITHUB_REF_NAME#routelocation-}" \
            --notes "RouteLocation ${GITHUB_REF_NAME#routelocation-}: Cellular/DVT stability fix, optional HealthKit route-step synchronization, auto-dismiss notifications, and public unsigned IPA assets. Re-sign with SideStore, AltStore, or a compatible tool."
